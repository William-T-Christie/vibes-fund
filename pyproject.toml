[project]
name = "vibes-fund"
version = "0.1.0"
description = "A $100,000 paper portfolio that Claude trades each weekday on the mood of the morning's headlines, tracked against SPY."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "feedparser>=6.0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
vibes = "vibes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
