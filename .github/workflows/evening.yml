name: Evening record

# 4:30 PM ET in both daylight and standard time. Pure code; never calls Claude.
on:
  schedule:
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: vibes-fund
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --no-dev

      - name: Mark, compute, publish
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: uv run vibes evening

      - name: Commit
        run: scripts/commit-data.sh "Evening record $(date -u +%F)"
