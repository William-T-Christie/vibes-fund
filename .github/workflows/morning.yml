name: Morning trade

# 9:40 AM ET in both daylight and standard time. The code checks the real New York time;
# the run that lands outside the window exits quietly.
on:
  schedule:
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
  workflow_dispatch: {}

# One group for every fund run, so two can never overlap.
concurrency:
  group: vibes-fund
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --no-dev

      - name: Gate, read the news, load the book
        id: prepare
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: uv run vibes morning-prepare

      - name: Commit hold note (if any)
        if: steps.prepare.outputs.proceed != 'true'
        run: scripts/commit-data.sh "Morning hold $(date -u +%F)"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.prepare.outputs.proceed == 'true'
        with:
          node-version: "22"
      - name: Install Claude Code
        if: steps.prepare.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.301

      - name: Ask the Chairman
        id: decide
        if: steps.prepare.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run vibes morning-decide

      # Committed before any order is placed, so the history proves nothing was edited afterward.
      - name: Commit the decision
        if: steps.prepare.outputs.proceed == 'true'
        run: scripts/commit-data.sh "Morning decision $(date -u +%F)"

      - name: Validate and trade
        if: steps.decide.outputs.proceed == 'true'
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: uv run vibes morning-trade

      - name: Commit the fills
        if: steps.decide.outputs.proceed == 'true'
        run: scripts/commit-data.sh "Morning fills $(date -u +%F)"
